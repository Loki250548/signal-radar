name: Signal Radar

on:
  schedule:
    # 04:30 UTC, Di–Sa = nach jedem US-Handelstag (Mo–Fr). Cron ist immer UTC.
    - cron: "30 4 * * 2-6"
  workflow_dispatch:      # Knopf "Run workflow" im Browser fuer sofortigen Testlauf

permissions:
  contents: write         # darf radar_data.json ins Repo zurueckschreiben

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Insider-Screener ausfuehren
        env:
          EDGAR_UA: ${{ vars.EDGAR_UA }}
        run: |
          python insider_screener.py --limit 1500 --min-value 10000
          python index_changes.py
          python attention.py
          python sympathy.py
          python core.py

      - name: Orakel (Prognose-Agent, lernt nur vorwaerts)
        continue-on-error: true
        run: |
          pip install --quiet numpy pandas yfinance
          python orakel/orakel.py run
          python orakel/pruefung.py

      - name: Ergebnis ins Repo schreiben
        run: |
          git config user.name  "signal-radar-bot"
          git config user.email "signal-radar-bot@users.noreply.github.com"
          git add radar_data.json index_data.json attention_data.json sympathy_data.json core_data.json research/events/sympathy_bluechip.json
          git add orakel/state/journal.jsonl orakel/state/bericht.md orakel/state/prior.json orakel_data.json || true
          git commit -m "Signal Radar $(date -u +%F)" || echo "keine Aenderung"
          git push
